# A push to this branch starts "Sync from Intercom" on main.
#
# GitHub's own schedule proved unreliable (4 runs in 24 hours for a ten-minute schedule, 8 Oct 2026),
# so a machine that is always on pushes here every ten minutes instead. This branch holds this file
# only; the site lives on main.
name: Tick

on:
  push:
    branches: [tick]

permissions:
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start the sync on main
        run: gh workflow run sync.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
